
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap');
  :root{--green:#2D4A3E;--cream:#F0EBE1;--cream-dark:#E5DDD1;--gold:#A8956A;--gold-light:#C4AE87;--text:#2D4A3E;--text-muted:#6B7F76;}
  *{box-sizing:border-box;margin:0;padding:0;}
  .wrap{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--text);max-width:800px;margin:0 auto;padding:3rem 1.5rem 4rem;}
  .brand-header{text-align:center;margin-bottom:3.5rem;padding-bottom:2rem;border-bottom:0.5px solid var(--gold-light);}
  .brand-header h1{font-size:3rem;font-weight:300;letter-spacing:0.08em;color:var(--green);margin-bottom:0.3rem;}
  .brand-header .subtitle{font-size:0.9rem;letter-spacing:0.22em;color:var(--gold);font-weight:300;font-style:italic;}
  .global-rules{background:var(--green);border-radius:12px;padding:1.8rem 2rem;margin-bottom:3rem;}
  .section-label{font-size:0.75rem;letter-spacing:0.26em;font-style:normal;font-weight:400;color:var(--gold-light);margin-bottom:1.2rem;display:block;text-transform:uppercase;}
  .rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 2rem;}
  .rule-item{font-size:1rem;color:var(--cream);font-weight:300;line-height:1.6;padding-left:1rem;border-left:1.5px solid var(--gold);}
  .rule-item strong{font-weight:400;display:block;font-size:0.78rem;color:var(--gold-light);margin-bottom:0.1rem;letter-spacing:0.1em;text-transform:uppercase;font-style:normal;}
  .reels-list{display:flex;flex-direction:column;gap:1.2rem;}
  .reel-card{background:#fff;border:0.5px solid var(--cream-dark);border-radius:12px;overflow:hidden;transition:border-color 0.2s;}
  .reel-card:hover{border-color:var(--gold-light);}
  .reel-header{display:flex;align-items:center;gap:1.2rem;padding:1.3rem 1.6rem;background:var(--cream);cursor:pointer;user-select:none;}
  .reel-num{font-size:2.2rem;font-weight:300;font-style:italic;color:var(--gold);line-height:1;min-width:2.2rem;text-align:center;}
  .reel-title-block{flex:1;}
  .reel-title{font-size:1.15rem;font-weight:400;letter-spacing:0.04em;color:var(--green);}
  .reel-goal{font-size:0.95rem;color:var(--text-muted);margin-top:0.15rem;font-weight:300;font-style:italic;}
  .pill{font-size:0.75rem;letter-spacing:0.08em;padding:0.28rem 0.8rem;border-radius:20px;background:var(--green);color:var(--cream);font-weight:300;font-style:italic;white-space:nowrap;}
  .chevron{width:16px;height:16px;color:var(--gold);transition:transform 0.3s;flex-shrink:0;}
  .reel-card.open .chevron{transform:rotate(180deg);}
  .reel-body{display:none;padding:1.4rem 1.6rem 1.6rem;border-top:0.5px solid var(--cream-dark);}
  .reel-card.open .reel-body{display:block;}
  .frames-label{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:0.9rem;display:block;font-style:normal;}
  .frames{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1.2rem;}
  .frame{display:flex;gap:0.9rem;align-items:flex-start;padding:0.65rem 0.9rem;border-radius:8px;background:var(--cream);}
  .frame.has-text{background:#f7f3ed;border-left:2px solid var(--gold);}
  .frame-num{font-size:1rem;font-style:italic;color:var(--gold);min-width:1.1rem;padding-top:0.1rem;text-align:center;}
  .frame-content{flex:1;}
  .frame-text{font-size:1rem;font-weight:300;line-height:1.5;color:var(--text);}
  .frame-onscreen{margin-top:0.35rem;display:flex;align-items:baseline;gap:0.5rem;}
  .onscreen-label{font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);font-style:normal;white-space:nowrap;}
  .onscreen-text{font-size:0.95rem;font-style:italic;font-weight:300;color:var(--green);}
  .caption-block{background:var(--green);border-radius:8px;padding:1rem 1.2rem;margin-top:0.4rem;}
  .caption-label{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-light);display:block;margin-bottom:0.5rem;font-style:normal;}
  .caption-text{font-size:1rem;font-weight:300;font-style:italic;color:var(--cream);line-height:1.65;}
  .hashtags{margin-top:0.6rem;display:flex;flex-wrap:wrap;gap:0.4rem;}
  .hashtag{font-size:0.82rem;font-style:italic;color:var(--gold-light);font-weight:300;}
  .note-block{font-size:0.95rem;color:var(--text-muted);font-weight:300;font-style:italic;padding:0.6rem 0.9rem;background:var(--cream);border-radius:8px;margin-top:0.8rem;line-height:1.55;border-left:2px solid var(--gold-light);}
  .footer-rules{margin-top:3rem;padding-top:2rem;border-top:0.5px solid var(--gold-light);}
  .footer-rules h3{font-size:1.8rem;font-weight:300;margin-bottom:1.2rem;color:var(--green);}
  .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
  .footer-rule{font-size:0.95rem;font-weight:300;color:var(--text);padding:0.6rem 0.9rem;background:var(--cream-dark);border-radius:6px;line-height:1.4;}
  @media(max-width:560px){.rules-grid,.footer-grid{grid-template-columns:1fr;}.reel-header,.reel-body{padding:1.1rem;}}
</style>

<div class="wrap">
  <div class="brand-header">

      <div class="rule-item"><strong>Цвет</strong>светлый, чистый, натуральный, дорогой</div>

</div>

    caption:"Stone set by hand. Every piece is shaped slowly — so it lasts.\nHandcrafted in silver in the Netherlands.",

const footerRules=[
  "Первый кадр всегда самый сильный",
  "Первые 2 секунды без раскачки",
  "Больше крупных планов: металл, камень, фактура, лента",
  "Общие кадры — только для контекста",
  "Не ставить подряд одинаковые ракурсы",
  "Текст минимальный",
  "Монтаж clean — без дешёвых эффектов",
  "Ролик должен выглядеть дорого, не «хендмейд-маркет»"
];

const container=document.getElementById('reels');
reels.forEach(reel=>{
  const card=document.createElement('div');
  card.className='reel-card';
  const framesHtml=reel.frames.map((f,j)=>`
    <div class="frame${f.onscreen?' has-text':''}">
      <div class="frame-num">${j+1}</div>
      <div class="frame-content">
        <div class="frame-text">${f.text}</div>
        ${f.onscreen?`<div class="frame-onscreen"><span class="onscreen-label">текст</span><span class="onscreen-text">${f.onscreen}</span></div>`:''}
      </div>
    </div>`).join('');
  card.innerHTML=`
    <div class="reel-header" onclick="toggle(this.parentElement)">
      <div class="reel-num">${reel.num}</div>
      <div class="reel-title-block">
        <div class="reel-title">${reel.title}</div>
        <div class="reel-goal">${reel.goal}</div>
      </div>
      <span class="pill">${reel.duration}</span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="reel-body">
      <span class="frames-label">По кадрам</span>
      <div class="frames">${framesHtml}</div>
      ${reel.note?`<div class="note-block">${reel.note}</div>`:''}
      <div class="caption-block">
        <span class="caption-label">Подпись к ролику</span>
        <div class="caption-text">${reel.caption.replace(/\n/g,'<br>')}</div>
        <div class="hashtags">${reel.tags.map(t=>`<span class="hashtag">${t}</span>`).join('')}</div>
      </div>
    </div>`;
  container.appendChild(card);
});

const footerEl=document.getElementById('footer-rules');
footerRules.forEach(r=>{
  const el=document.createElement('div');
  el.className='footer-rule';
  el.textContent=r;
  footerEl.appendChild(el);
});

function toggle(card){card.classList.toggle('open');}
</script>
